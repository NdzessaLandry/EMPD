{% extends "base.html" %}

{% block title %}{{ formation.titre }}  EMPD{% endblock %}

{% block content %}

<section class="section-empd">

    <div class="content-card">

        <span class="badge-empd mb-3">{{ formation.get_type_formation_display }}</span>

        <h1 class="mb-3">{{ formation.titre }}</h1>

        {% if formation.miniature %}
            <img
                src="{{ formation.miniature.url }}"
                alt="{{ formation.titre }}"
                class="img-fluid mb-3"
                style="width:100%; max-height:320px; object-fit:cover; border-radius: var(--radius-sm);"
                loading="lazy"
            >
        {% endif %}

        <p style="white-space: pre-line;">{{ formation.description }}</p>

        <a href="{% url 'formations:telecharger' formation.pk %}"
           class="btn btn-empd-primary mt-2">
            <i class="bi bi-download"></i> Télécharger
        </a>

    </div>

</section>

{% endblock %}
